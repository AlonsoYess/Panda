experiment_name: abmil_uni2h_binary
task: binary
label_column: cancer_label
input_dim: 1536
encoder_name: MahmoodLab/UNI2-h
encoder_family: UNI2-h

embeddings_root: /content/drive/MyDrive/PANDA_PROSTATE/outputs/abmil_uni2h_binary/embeddings
output_root: /content/drive/MyDrive/PANDA_PROSTATE/outputs/abmil_uni2h_binary
checkpoints_dir: /content/drive/MyDrive/PANDA_PROSTATE/outputs/abmil_uni2h_binary/checkpoints
metrics_dir: /content/drive/MyDrive/PANDA_PROSTATE/outputs/abmil_uni2h_binary/metrics
plots_dir: /content/drive/MyDrive/PANDA_PROSTATE/outputs/abmil_uni2h_binary/plots

seed: 42
device: cuda

epochs: 50
batch_size_bags: 1
learning_rate: 0.0001
weight_decay: 0.00001
dropout: 0.25
hidden_dim: 256
attention_dim: 128

num_workers: 2
amp: true

early_stopping_patience: 10
monitor_metric: valid_auc
save_every_epoch: true
resume: true
threshold_default: 0.5

max_train: null
max_valid: null
max_test: null
