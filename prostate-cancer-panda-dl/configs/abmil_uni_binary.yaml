data:
  zip_dir: data/raw_batches
  extracted_dir: data/extracted_batches
  manifest_dir: data/manifests
  embeddings_dir: outputs/abmil_uni_binary/embeddings

model:
  encoder_name: "MahmoodLab/uni"
  mil_model: "ABMIL"
  input_dim: auto
  hidden_dim: 512
  dropout: 0.25

embedding:
  batch_size_tiles: 16
  overwrite: false

train:
  epochs: 30
  batch_size_slides: 8
  lr: 0.0001
  weight_decay: 0.0001
  patience: 7
  num_workers: 0
  seed: 42
  use_amp: true

outputs:
  base_dir: outputs/abmil_uni_binary

