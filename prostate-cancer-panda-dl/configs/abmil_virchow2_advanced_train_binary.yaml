experiment_name: abmil_virchow2_advanced_binary
task: binary cancer detection
label_key: cancer_label
label_column: cancer_label
input_dim: 1280
encoder_name: virchow2
model_name: paige-ai/Virchow2

embeddings_root: /content/drive/MyDrive/PANDA_PROSTATE/outputs/virchow2_advanced_128/embeddings
output_root: /content/drive/MyDrive/PANDA_PROSTATE/outputs/abmil_virchow2_advanced_binary
checkpoints_dir: /content/drive/MyDrive/PANDA_PROSTATE/outputs/abmil_virchow2_advanced_binary/checkpoints
