experiment_name: dtfdmil_uni2h_advanced_binary
task: binary cancer detection
label_key: cancer_label
label_column: cancer_label
input_dim: 1536
encoder_name: uni2h
model_name: MahmoodLab/UNI2-h

embeddings_root: /content/drive/MyDrive/PANDA_PROSTATE/outputs/uni2h_advanced_128/embeddings
output_root: /content/drive/MyDrive/PANDA_PROSTATE/outputs/dtfdmil_uni2h_advanced_binary
checkpoints_dir: /content/drive/MyDrive/PANDA_PROSTATE/outputs/dtfdmil_uni2h_advanced_binary/checkpoints
metrics_dir: /content/drive/MyDrive/PANDA_PROSTATE/outputs/dtfdmil_uni2h_advanced_binary/metrics
plots_dir: /content/drive/MyDrive/PANDA_PROSTATE/outputs/dtfdmil_uni2h_advanced_binary/plots
logs_dir: /content/drive/MyDrive/PANDA_PROSTATE/outputs/dtfdmil_uni2h_advanced_binary/logs

seed: 42
device: cuda
epochs: 50
batch_size_bags: 1
learning_rate: 0.0001
weight_decay: 0.00001
dropout: 0.25
hidden_dim: 256
attention_dim: 128
num_pseudo_bags: 4
top_k: 8
num_workers: 2
amp: true
early_stopping_patience: 10
monitor_metric: valid_auc
save_every_epoch: true
resume: true
threshold_default: 0.5
max_train: null
max_valid: null
max_test: null
pos_weight: null
pseudo_bag_loss_weight: 0.5
instance_loss_weight: 0.3

expected_splits:
  - train
  - valid
  - test
